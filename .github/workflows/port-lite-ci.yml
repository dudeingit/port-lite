name: Port-Lite CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Validate Terraform formatting and syntax
        working-directory: ./terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate

      - name: Lint and render Helm chart
        run: |
          helm lint ./helm/app-template
          helm template ci-preview ./helm/app-template --namespace preview-ci > /dev/null

      - name: Run API health check smoke test
        run: |
          pip install -r api/requirements.txt
          python3 -c '
          from api.app import app
          client = app.test_client()
          resp = client.get("/health")
          assert resp.status_code == 200, resp.get_data(as_text=True)
          assert resp.get_json().get("status") == "healthy"
          print("Health check passed:", resp.get_json())
          '
